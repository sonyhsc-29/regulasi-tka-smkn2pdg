<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regulasi TKA | SMKN 2 Padang</title>
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --glass: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.18);
    --accent1: #ff6ec4;
    --accent2: #7873f5;
    --accent3: #4ade80;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg1: #fdf2f8;
      --bg2: #ede9fe;
      --bg3: #e0f2fe;
      --text: #1e1b4b;
      --muted: rgba(30, 27, 75, 0.7);
      --glass: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(30, 27, 75, 0.12);
    }
  }

  :root[data-theme="light"] {
    --bg1: #fdf2f8;
    --bg2: #ede9fe;
    --bg3: #e0f2fe;
    --text: #1e1b4b;
    --muted: rgba(30, 27, 75, 0.7);
    --glass: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(30, 27, 75, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
    background-size: 400% 400%;
    animation: gradientShift 14s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px env(safe-area-inset-bottom, 0px);
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    z-index: -1;
    animation: float 12s ease-in-out infinite;
  }
  .blob.one { width: 320px; height: 320px; background: var(--accent1); top: -80px; left: -60px; }
  .blob.two { width: 280px; height: 280px; background: var(--accent2); bottom: -60px; right: -40px; animation-delay: -6s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -20px); }
  }

  .container {
    width: 100%;
    max-width: 440px;
    text-align: center;
    padding-top: 24px;
    animation: fadeUp 0.8s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 104px;
    height: 104px;
    margin: 0 auto 16px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    box-shadow: 0 10px 30px rgba(120, 115, 245, 0.35);
  }
  .avatar span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--bg3);
    font-size: 2.4rem;
  }

  .avatar img {
    width: 84%;
    height: 84%;
    object-fit: contain;
    border-radius: 50%;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .bio {
    margin: 8px auto 28px;
    max-width: 340px;
    color: var(--muted);
    font-size: 0.96rem;
    line-height: 1.5;
  }

  .badge {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-weight: 700;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    color: #fff;
    letter-spacing: 0.04em;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    animation: fadeUp 0.6s ease both;
  }
  .btn:nth-child(1) { animation-delay: 0.10s; }
  .btn:nth-child(2) { animation-delay: 0.18s; }
  .btn:nth-child(3) { animation-delay: 0.26s; }
  .btn:nth-child(4) { animation-delay: 0.34s; }
  .btn:nth-child(5) { animation-delay: 0.42s; }
  .btn:nth-child(6) { animation-delay: 0.50s; }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--accent1);
    box-shadow: 0 12px 28px rgba(255, 110, 196, 0.25);
  }
  .btn:hover::before { transform: translateX(100%); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 3px solid var(--accent3); outline-offset: 3px; }

  .icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 1.25rem;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
  }

  .label { flex: 1; text-align: left; }

  .arrow {
    font-size: 1.1rem;
    opacity: 0.6;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .btn:hover .arrow { transform: translateX(4px); opacity: 1; }

  .btn.featured {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 10px 30px rgba(120, 115, 245, 0.35);
  }
  .btn.featured .icon { background: rgba(255, 255, 255, 0.22); }

  footer {
    margin-top: 32px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
